# layout_templates.yaml — 5 Premium Instagram Post Templates v3.0

templates:
  authority_card:
    name: "Authority Card"
    description: "Dark gradient, category badge, headline, stat highlights, info grid, CTA"
    layout:
      headline_zone: "top 25%"
      badge: true
      accent_bar: true
      info_zone: "middle 40% (2-col grid)"
      stat_highlight: true
      cta_zone: "bottom 15%"
      brand_zone: "bottom 5%"
    color_overlay:
      gradient: "top-bg to bottom-bg-subtle"
    mood: "professional, authoritative, premium"

  breaking_impact:
    name: "Breaking Impact"
    description: "Bold solid bg, accent bars top+bottom, breaking badge, row cards, big stats"
    layout:
      headline_zone: "top 20%"
      accent_bars: "top + bottom (8px)"
      breaking_badge: true
      info_zone: "middle 45% (row cards)"
      stat_highlight: true
      cta_zone: "bottom 15%"
      brand_zone: "bottom 5%"
    color_overlay:
      solid_bg: true
    mood: "urgent, bold, attention-grabbing"

  compare_contrast:
    name: "Compare Contrast"
    description: "Split layout, VS badge, before/after side-by-side, checklist"
    layout:
      headline_zone: "top 20%"
      split: "50/50 left-right"
      vs_badge: "center circle"
      info_zone: "middle 50% (alternating sides)"
      cta_zone: "bottom 15%"
    color_overlay:
      gradient: "top-bg to bottom-bg-subtle"
    mood: "comparative, revealing, educational"

  infographic_story:
    name: "Infographic Story"
    description: "Vertical numbered steps, progress dots left side, stat summary box"
    layout:
      headline_zone: "top 20%"
      step_zone: "middle 50% (numbered list)"
      progress_line: "left side (80px from left)"
      summary_box: "floating card"
      cta_zone: "bottom 15%"
    color_overlay:
      gradient: "top-bg to bottom-bg-subtle"
    mood: "educational, step-by-step, clear"

  social_proof:
    name: "Social Proof"
    description: "Success story badge, quote typography, stat callout box, testimonial"
    layout:
      headline_zone: "top 20%"
      quote_zone: "middle 30%"
      stat_callout: "floating box (120px height)"
      cta_zone: "bottom 15%"
    color_overlay:
      gradient: "top-bg to bottom-bg-subtle"
    mood: "inspiring, trustworthy, real"

# Template to pillar mapping (preferred templates per content type)
pillar_template_map:
  loans_subsidies: ["authority_card", "breaking_impact", "infographic_story"]
  government_schemes: ["infographic_story", "authority_card"]
  compliance_updates: ["breaking_impact", "compare_contrast"]
  business_registration: ["authority_card", "infographic_story"]
  business_growth: ["social_proof", "compare_contrast"]
  student_services: ["infographic_story", "authority_card"]
  success_stories: ["social_proof"]
  myth_vs_reality: ["compare_contrast", "breaking_impact"]

# Quality gates (applied to every generated image)
quality_gates:
  min_unique_colors: 20
  max_light_pct: 0.40
  min_accent_pct: 0.02
  min_font_sizes: 3
  headline_min_font_size: 48
  auto_reject_flat_bg: true
  auto_reject_high_whitespace: true
